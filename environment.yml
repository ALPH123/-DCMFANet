# ============================================================
# DCMFANet Conda Environment (reproducible across OS)
# ============================================================
name: dcmfanet
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.9.16
  - pytorch=2.0.1
  - torchvision=0.15.2
  - torchaudio=2.0.2
  - cudatoolkit=11.8
  - numpy=1.24.3
  - pandas=2.0.2
  - scikit-learn=1.2.2
  - matplotlib=3.7.1
  - seaborn=0.12.2
  - scipy=1.10.1
  - imbalanced-learn=0.10.1
  - optuna=3.2.0
  - openpyxl=3.1.2
  - pip
  - pip:
    - torch-geometric==2.3.0
    - TCGAbiolinks==2.28.0
    - pycombat==0.2.0
    - shap==0.41.0